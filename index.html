<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公演概要書メーカー｜LIVE制作の公演概要書をスマホで作成</title>
<meta name="description" content="LIVE・コンサートの公演概要書をスマホやPCで簡単に作成。PDF・Excelで保存、A4用紙1枚にまとめて出力できます。">
<meta property="og:title" content="公演概要書メーカー">
<meta property="og:description" content="LIVE制作の公演概要書をスマホで作成。PDF・Excel出力対応。">
<meta name="theme-color" content="#1f3a5f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%231f3a5f%22/%3E%3Crect x=%2218%22 y=%2214%22 width=%2228%22 height=%2236%22 rx=%223%22 fill=%22%23fff%22/%3E%3Crect x=%2223%22 y=%2222%22 width=%2218%22 height=%223%22 fill=%22%231f3a5f%22/%3E%3Crect x=%2223%22 y=%2229%22 width=%2218%22 height=%223%22 fill=%22%231f3a5f%22/%3E%3Crect x=%2223%22 y=%2236%22 width=%2212%22 height=%223%22 fill=%22%231f3a5f%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f4f2;--card:#fff;--ink:#1d1d1f;--sub:#6b6b70;--line:#e3e3e0;
  --accent:#1f3a5f;--accent-soft:#e8eef6;--danger:#b42318;--radius:12px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141416;--card:#1e1e21;--ink:#f2f2f2;--sub:#a0a0a8;--line:#323236;--accent:#8fb3e6;--accent-soft:#25303f;}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.head-in{max-width:760px;margin:0 auto;padding:12px 16px 0}
h1{font-size:17px;margin:0 0 10px;font-weight:700;letter-spacing:.02em}
.tabs{display:flex;gap:4px}
.tab{flex:1;border:0;background:none;padding:10px 0;font:inherit;font-weight:500;color:var(--sub);border-bottom:2px solid transparent;cursor:pointer}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
main{max-width:760px;margin:0 auto;padding:16px 16px 120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px}
.card-h h2{font-size:15px;margin:0;font-weight:700}
.badge{font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:99px;padding:2px 8px;margin-left:6px;font-weight:500;vertical-align:2px}
.card-b{padding:0 16px 16px}
.card.off .card-b{display:none}
.card.off .card-h h2{color:var(--sub)}
.f{display:block;margin-top:12px}
.f:first-child{margin-top:0}
.f span{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
input,textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}
textarea{min-height:72px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid2 .f:nth-child(2){margin-top:0}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch i{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s;cursor:pointer}
.switch i::after{content:"";position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch input:checked + i{background:var(--accent)}
.switch input:checked + i::after{transform:translateX(18px)}
.list{margin-top:12px}
.list-t{font-size:12px;color:var(--sub);margin-bottom:6px}
.row{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.row input{padding:8px}
.del{flex:none;width:34px;height:38px;border:1px solid var(--line);background:none;border-radius:8px;color:var(--sub);font-size:18px;cursor:pointer}
.add{border:1px dashed var(--line);background:none;color:var(--accent);font:inherit;font-size:14px;padding:8px;border-radius:8px;width:100%;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar-in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;font:inherit;font-weight:500;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--card)}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools .btn{font-size:13px;padding:9px}
.note{font-size:12px;color:var(--sub);margin:0 0 12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:99px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:20}
.modal.on{display:flex}
.modal-box{background:var(--card);border-radius:var(--radius);padding:20px;max-width:340px;width:100%}
.modal-box p{margin:0 0 16px}
.modal-box .bar-in{gap:8px}
.sheet .modal-box{max-width:380px}
.sheet-t{font-weight:700;margin:0 0 12px !important}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.opt b{display:block;font-weight:700}
.opt small{color:var(--sub);font-size:12px}
.opt[hidden]{display:none}
.sheet .note{margin:4px 0 12px}
.toast{z-index:30}
.q{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;margin-left:6px;padding:0;border-radius:50%;border:1px solid var(--accent);background:var(--card);color:var(--accent);font:700 12px/1 system-ui,sans-serif;cursor:pointer;vertical-align:1px;position:relative}
.q::after{content:"";position:absolute;inset:-10px}
.f span{display:flex;align-items:center}
.list-t{display:flex;align-items:center}
#help .modal-box{max-width:400px}
#helpT{font-weight:700;margin:0 0 8px !important}
#helpB{margin:0 0 16px !important;line-height:1.8}
.vbox{position:relative}
.hint{display:block;font-size:11.5px;color:var(--sub);margin-top:5px;line-height:1.5}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:15;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:320px;overflow:auto}
.sugg[hidden]{display:none}
.sg{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:10px 12px;cursor:pointer}
.sg:last-child{border-bottom:0}
.sg:hover,.sg:focus{background:var(--accent-soft)}
.sg b{display:block;font-weight:500;font-size:14px}
.sg small{color:var(--sub);font-size:12px}
.sg em{display:block;font-style:normal;color:var(--danger);font-size:11.5px;margin-top:2px}
.req{font-style:normal;font-size:10px;color:#fff;background:var(--danger);border-radius:4px;padding:0 5px;margin-left:6px;line-height:16px}
.one{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.one[hidden]{display:none}
.one input{width:20px;height:20px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.one b{display:block;font-weight:700}
.one small{color:var(--sub);font-size:12px}
.miss-note{background:#fff1f0;color:#b42318;border:1px solid #fecdca;border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 12px}
.paper .miss{color:#d92d20 !important;font-weight:700;background:#fff1f0}
.paper .miss-ttl{color:#d92d20}
.paper .ttl .sub{font-size:.85em;font-weight:500}
.paper.compact h3{font-size:17px}
.paper.compact .meta{margin-bottom:8px}
.paper.compact .ttl{font-size:14px;margin-bottom:10px;padding-bottom:8px}
.paper.compact h4{margin:10px 0 4px;font-size:11.5px;padding:3px 6px}
.paper.compact th,.paper.compact td{padding:3px 6px}
.paper .cols{display:flex;gap:16px;align-items:flex-start}
.paper .col{flex:1;min-width:0}
.paper .col .sec:first-child h4{margin-top:0}
.ubox{position:relative;min-width:0}
.ubox input{padding-right:34px}
.unit{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--sub);font-size:15px;pointer-events:none}
.unit.pre{right:auto;left:10px}
.ubox:has(.unit.pre:not([hidden])) input{padding-left:24px}
.unit[hidden]{display:none}
/* preview */
#preview{display:none}
.paper{background:#fff;color:#111;border-radius:6px;padding:28px 22px;box-shadow:0 1px 3px rgba(0,0,0,.08);font-size:13px}
.paper h3{font-size:20px;text-align:center;margin:0 0 4px;letter-spacing:.1em}
.paper .meta{text-align:right;font-size:11px;color:#555;margin-bottom:16px}
.paper .ttl{text-align:center;font-size:16px;font-weight:700;margin:0 0 18px;padding-bottom:12px;border-bottom:2px solid #111}
.paper h4{font-size:13px;margin:18px 0 6px;padding:4px 8px;background:#eef1f5;border-left:4px solid #1f3a5f}
.paper table{width:100%;border-collapse:collapse}
.paper th,.paper td{border:1px solid #ccc;padding:5px 8px;text-align:left;vertical-align:top;white-space:pre-wrap;word-break:break-word}
.paper th{background:#f7f7f7;width:32%;font-weight:500}
.paper .empty{color:#aaa;text-align:center;padding:40px 0}
.paper .tt td:first-child{width:22%;font-variant-numeric:tabular-nums}
/* PC：入力とプレビューを左右に並べる */
@media (min-width:1000px){
  .head-in,main,.bar-in{max-width:1280px}
  .tabs,#toggleView{display:none}
  h1{margin-bottom:12px}
  main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  #edit{display:block !important}
  #preview{display:block !important;position:sticky;top:64px;max-height:calc(100vh - 150px);overflow:auto}
  .paper{padding:40px 36px;font-size:13.5px}
  .bar-in{justify-content:flex-end}
  .bar .btn{flex:0 0 220px}
}
</style>
</head>
<body>
<header><div class="head-in">
  <h1>公演概要書メーカー</h1>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-v="edit">入力</button>
    <button class="tab" role="tab" aria-selected="false" data-v="preview">プレビュー</button>
  </div>
</div></header>

<main>
  <section id="edit">
    <div class="tools">
      <button class="btn" id="sample">サンプルを入れる</button>
      <button class="btn" id="reset">全部消す</button>
    </div>
    <p class="note">入力はこの端末に自動で保存されます。使わない項目はスイッチでOFFにすると概要書に出ません。</p>
    <div id="form"></div>
  </section>
  <section id="preview"><p class="miss-note" id="missNote" hidden></p><div class="paper" id="paper"></div></section>
</main>

<div class="bar"><div class="bar-in">
  <button class="btn" id="toggleView">プレビューを見る</button>
  <button class="btn pri" id="copy">保存・コピー</button>
</div></div>

<div class="modal sheet" id="sheet"><div class="modal-box">
  <p class="sheet-t">公演概要書を書き出す</p>
  <label class="one dl-only" hidden><input type="checkbox" id="onePage"><span><b>A4用紙1枚にまとめる</b><small>2列に並べて、入りきらない分は文字を小さくします</small></span></label>
  <button class="opt dl-only" id="savePdf" hidden><b>PDFで保存</b><small>A4サイズ。印刷や配布用</small></button>
  <button class="opt dl-only" id="saveXlsx" hidden><b>Excelで保存</b><small>表の形で保存。あとから編集できる</small></button>
  <button class="opt" id="copyText"><b>テキストでコピー</b><small>DMやメールにそのまま貼れる</small></button>
  <p class="note" id="dlNote" hidden></p>
  <button class="btn" data-close style="width:100%">閉じる</button>
</div></div>
<div class="modal" id="help" role="dialog" aria-modal="true"><div class="modal-box">
  <p id="helpT"></p><p id="helpB"></p>
  <button class="btn" data-close style="width:100%">わかった</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"><div class="modal-box">
  <p id="modalMsg"></p>
  <div class="bar-in"><button class="btn" id="mNo">やめる</button><button class="btn pri" id="mYes">OK</button></div>
</div></div>

<script>
const SECTIONS=[
 {id:"basic",title:"基本情報",req:true,fields:[
  {k:"name",l:"公演名",p:"〇〇 LIVE TOUR 2026"},
  {k:"nameKana",l:"公演名ヨミ",p:"マルマル ライブ ツアー ニセンニジュウロク"},
  {k:"title",l:"ライブタイトル",p:"公演ごとのタイトルがあれば"},
  {k:"titleKana",l:"ライブタイトルヨミ",p:"カタカナで"},
  {k:"artist",l:"出演者",p:"アーティスト名（ゲストがいれば併記）"},
  {k:"artistKana",l:"出演者ヨミ",p:"カタカナで"},
  {k:"date",l:"日程",t:"date"},
  {k:"venue",l:"会場名",p:"〇〇ホール"},
  {k:"address",l:"会場住所",p:"東京都〇〇区…"},
  {k:"venueTel",l:"会場電話番号",p:"03-xxxx-xxxx",t:"tel"},
  {g:[{k:"cap",l:"キャパ",p:"500",unit:"人"},{k:"style",l:"公演形態",t:"select",o:["","スタンディング","全席指定","一部指定","着席（自由席）"]}]}
 ]},
 {id:"org",title:"主催・制作体制",req:true,fields:[
  {k:"host",l:"主催",p:"株式会社〇〇"},
  {k:"plan",l:"企画・制作",p:""},
  {k:"ops",l:"運営",p:""},
  {k:"support",l:"協力・後援",p:""},
  {k:"contacts",l:"担当者・連絡先",t:"list",labelOnlyDrop:true,cols:[{k:"r",p:"役割",w:"28%"},{k:"n",p:"名前",w:"30%"},{k:"c",p:"連絡先"}],def:[["制作責任者","",""],["舞台監督","",""]]},
  {k:"emergency",l:"当日の緊急連絡先",p:"名前・電話番号"}
 ]},
 {id:"ticket",title:"チケット",fields:[
  {k:"cur",l:"通貨",t:"select",o:["円","$"],ol:["円（日本円）","$（米ドル）"],noOut:true},
  {k:"tickets",l:"券種と料金",t:"list",cols:[{k:"n",p:"券種",w:"55%"},{k:"v",p:"料金",money:true}],def:[["",""]]},
  {g:[{k:"drink",l:"ドリンク代",p:"600",money:true},{k:"reentry",l:"再入場",t:"select",o:["","可","不可","条件付き可"]}]},
  {k:"sale",l:"販売スケジュール",t:"textarea",p:"先行：〇/〇〜\n一般：〇/〇〜"},
  {k:"pg",l:"プレイガイド",p:"ぴあ／ローチケ／e+"},
  {k:"order",l:"入場順",p:"整理番号順 → 一般"},
  {k:"age",l:"年齢制限",p:"未就学児入場不可 など"}
 ]},
 {id:"goods",title:"物販",fields:[
  {k:"gTime",l:"販売開始時間",p:"開場1時間前〜"},
  {k:"gPlace",l:"販売場所",p:"ロビー"},
  {k:"gPay",l:"決済方法",p:"現金／クレジット／電子マネー"},
  {k:"gPre",l:"先行販売",p:"あり（〇:〇〜）／なし"}
 ]},
 {id:"safety",title:"安全・注意事項",req:true,fields:[
  {k:"photo",l:"撮影・録音",p:"撮影・録音禁止（〇〇のみ撮影可）"},
  {k:"ban",l:"禁止事項",t:"textarea"},
  {k:"aid",l:"救護体制",p:"救護所の場所・担当"},
  {k:"exit",l:"避難経路",p:"図面を添付 など"},
  {k:"cancel",l:"雨天・中止時の対応",t:"textarea"}
 ]},
 {id:"media",title:"配信・収録・メディア",fields:[
  {g:[{k:"stream",l:"配信",t:"select",o:["","なし","あり"]},{k:"rec",l:"収録",t:"select",o:["","なし","あり"]}]},
  {k:"press",l:"取材対応",t:"textarea"},
  {k:"guest",l:"関係者招待枠",p:"10",unit:"名"}
 ]},
 {id:"manage",title:"管理情報",req:true,fields:[
  {g:[{k:"made",l:"作成日",t:"date"},{k:"ver",l:"版数",p:"第1版"}]},
  {k:"author",l:"作成者",p:""},
  {k:"changes",l:"更新した箇所",t:"textarea",p:"第2版：開場時間を変更 など"},
  {k:"memo",l:"備考",t:"textarea"}
 ]}
];

// 運営マニュアルメーカーで使う予定の項目（公演概要書からは外したもの）
const MANUAL_SECTIONS=[
 {id:"time",title:"タイムスケジュール",req:true,fields:[
  {k:"tt",l:"時間と内容",t:"list",cols:[{k:"t",p:"13:00",w:"30%"},{k:"v",p:"会場入り・搬入"}],
   def:[["",'会場入り'],["",'搬入'],["",'仕込み'],["",'リハーサル'],["",'開場'],["",'開演'],["",'終演予定'],["",'撤去・搬出'],["",'会場退館']]}
 ]},
 {id:"tech",title:"技術（舞台・音響・照明・映像）",fields:[
  {k:"stage",l:"ステージ寸法",p:"間口〇m × 奥行〇m × 高さ〇m"},
  {k:"gear",l:"機材の持ち込み・レンタル",t:"textarea"},
  {k:"power",l:"電源容量",p:"〇A（〇系統）"},
  {k:"sfx",l:"特効",t:"select",o:["","なし","あり（内容は備考に）"]},
  {k:"attach",l:"添付資料",p:"ステージ図面、機材リスト など"},
  {k:"techNote",l:"技術備考",t:"textarea"}
 ]},
 {id:"back",title:"バックヤード",fields:[
  {k:"room",l:"楽屋割り",t:"textarea",p:"楽屋A：出演者\n楽屋B：バンド"},
  {k:"cater",l:"ケータリング",p:"弁当〇食・ケータリング あり／なし"},
  {k:"car",l:"搬入車両・駐車場",p:"4tトラック1台、駐車〇台"},
  {k:"pass",l:"パス",p:"スタッフパス・関係者パスの種類"}
 ]},
 {id:"staff",title:"スタッフ配置",fields:[
  {k:"staffs",l:"担当と人数",t:"list",labelOnlyDrop:true,cols:[{k:"n",p:"担当",w:"60%"},{k:"v",p:"人数",unit:"名"}],def:[["受付",""],["誘導",""],["物販",""],["警備",""]]}
 ]}
];

// 「？」で出す解説（初めての人向け）
const HELP={
 "sec:basic":"公演の「いつ・どこで・誰が」をまとめる部分です。関わる人全員が最初に見るので、間違いがないように一番丁寧に確認します。",
 nameKana:"公演名の読み方をカタカナで書きます。チケット会社への登録、場内アナウンス、電話での問い合わせ対応で必要になります。",
 title:"ツアー名とは別に、公演ごとのタイトルがある場合に書きます（例：ツアーファイナル公演の特別タイトルなど）。なければ空欄でOKです。",
 titleKana:"ライブタイトルの読み方をカタカナで書きます。",
 artistKana:"出演者の読み方をカタカナで書きます。英語名のアーティストは読み間違いが多いので、特に大事です。",
 name:"チケットや告知と同じ正式名称を書きます。略称だと、ほかの公演の資料と混ざってしまうことがあります。",

function norm(s){return String(s||"").normalize("NFKC").toLowerCase().replace(/[ァ-ヶ]/g,ch=>String.fromCharCode(ch.charCodeAt(0)-0x60)).replace(/[\s・()（）\-_.'’]/g,"")}

function pref(a){const m=a.match(/^(東京都|北海道|(?:京都|大阪)府|.{2,3}県)/);return m?m[1]:""}
function showSugg(input){
  const box=input.closest(".vbox").querySelector(".sugg");if(!box)return;
  const list=findVenues(input.value);
  if(!list.length||list.some(v=>v.n===input.value)){box.hidden=true;box.innerHTML="";return}

}

const KEY="gaiyousho-v1";
let S=load()||blank();

function blank(){
  const s={on:{},v:{}};
  SECTIONS.forEach(sec=>{
    s.on[sec.id]=!!sec.req;
    flat(sec).forEach(f=>{ s.v[f.k]= f.t==="list" ? f.def.map(r=>Object.fromEntries(f.cols.map((c,i)=>[c.k,r[i]||""]))) : ""; });
  });
  s.v.ver="第1版";
  return s;
}
function flat(sec){return sec.fields.flatMap(f=>f.g?f.g:[f])}
function load(){try{const j=localStorage.getItem(KEY);return j?JSON.parse(j):null}catch(e){return null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}


// 金額：数字を入れると自動で「円」か「$」を付ける
function curOf(){return S.v.cur==="$"?"$":"円"}
function moneyPh(){return curOf()==="$"?"45":"6500"}
function fmtMoney(str){
  str=String(str||"").trim();if(!str)return "";
  const raw=str.normalize("NFKC").replace(/[,，\s円¥￥$＄]|ドル|USD|JPY/gi,"");
  if(!/^\d+(\.\d+)?$/.test(raw))return str;
  const n=parseFloat(raw);
  if(curOf()==="$")return "$"+n.toLocaleString("en-US",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2});
  return Math.round(n).toLocaleString("ja-JP")+"円";
}

// 単位：入力中は右（$は左）に単位を表示し、入力が終わったら自動で付ける
function unitOf(f){return f.money?curOf():(f.unit||"")}
function isBare(v){const r=String(v||"").normalize("NFKC").replace(/[,\s]/g,"");return r===""||/^\d+(\.\d*)?$/.test(r)}
function unitSpan(f,v){const u=unitOf(f);return `<span class="unit${u==="$"?" pre":""}"${isBare(v)?"":" hidden"}>${esc(u)}</span>`}
function updUnit(inp){const sp=inp.parentElement.querySelector(".unit");if(sp)sp.hidden=!isBare(inp.value)}
function fmtUnit(str,u){
  if(u==="money")return fmtMoney(str);
  str=String(str||"").trim();if(!str)return "";
  const raw=str.normalize("NFKC").replace(/[,，\s]/g,"").replace(new RegExp(u+"$"),"");
  if(!/^\d+(\.\d+)?$/.test(raw))return str;
  return parseFloat(raw).toLocaleString("ja-JP")+u;
}
function fieldHTML(f){
  const val=S.v[f.k]??"";
  if(f.t==="list"){
    const rows=(val||[]).map((r,i)=>`<div class="row">${f.cols.map(c=>(unitOf(c)?`<div class="ubox" style="flex:${c.w?"0 0 "+c.w:"1"}"><input data-list="${f.k}" data-i="${i}" data-c="${c.k}" placeholder="${esc(c.money?moneyPh():c.p)}" value="${esc(r[c.k])}" data-unit="${c.money?"money":c.unit}" inputmode="decimal">${unitSpan(c,r[c.k])}</div>`:`<input data-list="${f.k}" data-i="${i}" data-c="${c.k}" placeholder="${esc(c.p)}" value="${esc(r[c.k])}"${c.w?` style="flex:0 0 ${c.w}"`:""}>`)).join("")}<button class="del" data-del="${f.k}" data-i="${i}" aria-label="行を削除">×</button></div>`).join("");
    return `<div class="list"><div class="list-t">${esc(f.l)}${qBtn(f.k,f.l)}</div>${rows}<button class="add" data-add="${f.k}">＋ 行を追加</button></div>`;
  }
  let input;
  if(f.t==="textarea") input=`<textarea data-k="${f.k}" placeholder="${esc(f.p||"")}">${esc(val)}</textarea>`;

function fmtDate(d){
  if(!d)return"";const x=new Date(d+"T00:00:00");if(isNaN(x))return d;
  return `${x.getFullYear()}年${x.getMonth()+1}月${x.getDate()}日（${"日月火水木金土"[x.getDay()]}）`;
}
function dispVal(f){
  const v=S.v[f.k];
  if(f.t==="date")return fmtDate(v);
  if(f.t==="list"){
    const rows=(v||[]).filter(r=>f.cols.some(c=>(r[c.k]||"").trim()));
    return rows;
  }
  return (v||"").trim();
}
function hasContent(sec){return flat(sec).some(f=>{if(f.noOut)return false;const d=dispVal(f);return Array.isArray(d)?d.length:d})}

// 概要書の中身を共通の形にまとめる（画面・テキスト・PDF・Excelで共用）
// 必須項目：未入力なら赤く「未入力」と出す。必須でない空欄は出さない
const REQUIRED=new Set(["name","artist","date","venue","address","host","emergency","photo","cancel"]);
const REQUIRED_TT=[];
function docModel(){
  const m=S.v;let miss=0;
  const secs=SECTIONS.filter(s=>s.id!=="manage"&&(s.req||(S.on[s.id]&&hasContent(s)))).map(sec=>{
    const o={title:sec.title,tt:[],singles:[],lists:[]};
    flat(sec).forEach(f=>{
      if(f.noOut)return;
      const d=dispVal(f);
      if(f.t==="list"){
        if(f.k==="tt"){
          (S.v.tt||[]).forEach(r=>{
            const t=(r.t||"").trim(),v=(r.v||"").trim();
            const need=REQUIRED_TT.some(x=>v===x||v.startsWith(x));
            if(t)o.tt.push({t,v});
            else if(need){o.tt.push({t:"",v,miss:true});miss++}
          });
          REQUIRED_TT.forEach(x=>{if(!(S.v.tt||[]).some(r=>(r.v||"").trim().startsWith(x))){o.tt.push({t:"",v:x,miss:true});miss++}});
          return;
        }
        const rows=f.labelOnlyDrop?d.filter(r=>f.cols.slice(1).some(c=>(r[c.k]||"").trim())):d;
        if(rows.length)o.lists.push({cols:f.cols.map(c=>c.p),rows:rows.map(r=>f.cols.map(c=>r[c.k]||""))});
      }else if(d)o.singles.push({l:f.l,v:d});
      else if(REQUIRED.has(f.k)){o.singles.push({l:f.l,v:"",miss:true});miss++}
    });
    return o;
  });
  const mg=[m.changes&&{l:"更新した箇所",v:m.changes.trim()},m.memo&&{l:"備考",v:m.memo.trim()}].filter(x=>x&&x.v);
  if(mg.length)secs.push({title:"更新履歴・備考",tt:[],singles:mg,lists:[]});
  return {sub:(m.title||"").trim(),name:(m.name||"").trim(),meta:[m.ver,m.made&&"作成日 "+fmtDate(m.made),m.author&&"作成者 "+m.author].filter(Boolean),secs,miss};
}

  if(s.singles.length)h+=`<table>${s.singles.map(x=>`<tr><th>${esc(x.l)}</th><td${x.miss?' class="miss"':""}>${x.miss?MISS:esc(x.v)}</td></tr>`).join("")}</table>`;

  });

}
function headHTML(d){

function loadLib(src){
  return libCache[src]||(libCache[src]=new Promise((ok,ng)=>{
    const s=document.createElement("script");s.src=src;s.onload=ok;

// ---- PDF（A4縦） ----
async function makePDF(onePage){
  await Promise.all([loadLib(CDN+"html2canvas/1.4.1/html2canvas.min.js"),loadLib(CDN+"jspdf/2.5.1/jspdf.umd.min.js")]);
  try{await document.fonts.ready}catch(e){}
  const W=794,PAGE_H=Math.floor(W*297/210),MT=40,MB=40,BODY=PAGE_H-MT-MB;
  const d=docModel();
  const box=document.createElement("div");
  box.className="paper pdf"+(onePage?" compact":"");
  box.style.cssText=`position:fixed;left:-20000px;top:0;width:${W}px;padding:0 ${onePage?36:56}px;border-radius:0;box-shadow:none;font-size:${onePage?11:13}px`;
  document.body.appendChild(box);
  try{
    if(onePage){
      // 2列に並べて、高さがそろうように振り分ける
      box.innerHTML=headHTML(d)+'<div class="cols"><div class="col"></div><div class="col"></div></div>';
      const cols=box.querySelectorAll(".col");
      d.secs.forEach(s=>{
        const c=cols[0].offsetHeight<=cols[1].offsetHeight?cols[0]:cols[1];
        c.insertAdjacentHTML("beforeend",secHTML(s));
      });
    }else box.innerHTML=headHTML(d)+d.secs.map(secHTML).join("");
    const top0=box.getBoundingClientRect().top;
    const totalH=box.scrollHeight;
    const SCALE=2;
    const canvas=await html2canvas(box,{scale:SCALE,backgroundColor:"#ffffff",width:W,windowWidth:W,useCORS:true,logging:false});
    const {jsPDF}=window.jspdf;
    const pdf=new jsPDF({unit:"mm",format:"a4",orientation:"portrait"});
    const mmPerPx=210/W;
    let shrink=1;
    if(onePage){
      shrink=Math.min(1,BODY/totalH);
      const w=210*shrink,h=totalH*mmPerPx*shrink;
      pdf.addImage(canvas.toDataURL("image/jpeg",0.95),"JPEG",(210-w)/2,MT*mmPerPx,w,h);
    }else{
      const cuts=[];
      box.querySelectorAll("h4").forEach(el=>cuts.push(el.getBoundingClientRect().top-top0-4));
      box.querySelectorAll("tr").forEach(el=>cuts.push(el.getBoundingClientRect().bottom-top0+1));
      cuts.sort((a,b)=>a-b);
      const pages=[];let y=0;
      while(y<totalH-1){
        let end=y+BODY;
        if(end>=totalH){pages.push([y,totalH]);break}
        const ok=cuts.filter(c=>c>y+40&&c<=end);
        if(ok.length)end=ok[ok.length-1];
        pages.push([y,end]);y=end;
      }
      pages.forEach(([a,b],i)=>{
        if(i)pdf.addPage();
        const h=Math.ceil(b-a);
        const c=document.createElement("canvas");
        c.width=W*SCALE;c.height=h*SCALE;
        const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
        g.drawImage(canvas,0,Math.round(a*SCALE),c.width,c.height,0,0,c.width,c.height);
        pdf.addImage(c.toDataURL("image/jpeg",0.92),"JPEG",0,MT*mmPerPx,210,h*mmPerPx);
        pdf.setFontSize(8);pdf.setTextColor(150);
        pdf.text(`${i+1} / ${pages.length}`,105,297-6,{align:"center"});
      });
    }
    return {data:pdf.output("blob"),shrink};
  }finally{box.remove()}
}

// ---- Excel ----
async function makeXLSX(onePage){
  await loadLib(CDN+"exceljs/4.4.0/exceljs.min.js");
  const d=docModel();
  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet("公演概要書",{pageSetup:{paperSize:9,orientation:"portrait",fitToPage:true,fitToWidth:1,fitToHeight:onePage?1:0,margins:{left:.4,right:.4,top:.5,bottom:.5,header:.3,footer:.3}}});
  ws.columns=[{width:22},{width:24},{width:24},{width:24}];
  const font={name:"游ゴシック",size:onePage?9.5:10.5};
  const thin={style:"thin",color:{argb:"FFBFBFBF"}};
  const border={top:thin,left:thin,bottom:thin,right:thin};
  const RED={font:{color:{argb:"FFD92D20"},bold:true},fill:"FFFFF1F0"};
  let r=1;
  const put=(row,col,val,opt={})=>{
    const c=ws.getCell(row,col);c.value=val;
    c.font={...font,...(opt.font||{})};
    c.alignment={vertical:"top",wrapText:true,...(opt.align||{})};
    if(opt.fill)c.fill={type:"pattern",pattern:"solid",fgColor:{argb:opt.fill}};
    if(opt.border)c.border=border;
    return c;
  };
  const merge=(row,a,b)=>{if(b>a)ws.mergeCells(row,a,row,b)};
  const lh=onePage?13:15;
  const fitH=(row,txt,chars)=>{const n=String(txt).split("\n").reduce((s,l)=>s+Math.max(1,Math.ceil(l.length/chars)),0);ws.getRow(row).height=Math.max(onePage?16:20,n*lh+4)};
  const val2=(cells,row)=>{cells.forEach(([col,v,opt])=>put(row,col,v,opt))};

  put(r,1,"公演概要書",{font:{size:onePage?15:18,bold:true},align:{horizontal:"center",vertical:"middle"}});merge(r,1,4);ws.getRow(r).height=onePage?24:32;r++;
  if(d.meta.length){put(r,1,d.meta.join("　"),{font:{size:9,color:{argb:"FF666666"}},align:{horizontal:"right"}});merge(r,1,4);r++}
  put(r,1,d.name?(d.name+(d.sub?"　"+d.sub:"")):"公演名："+MISS,{font:{size:onePage?12:14,bold:true,...(d.name?{}:RED.font)},align:{horizontal:"center",vertical:"middle"}});merge(r,1,4);ws.getRow(r).height=onePage?20:26;
  for(let c=1;c<=4;c++)ws.getCell(r,c).border={bottom:{style:"medium",color:{argb:"FF111111"}}};r++;

  d.secs.forEach(s=>{
    if(!onePage)r++;
    put(r,1,"■ "+s.title,{font:{bold:true,color:{argb:"FF1F3A5F"}},align:{vertical:"middle"}});merge(r,1,4);
    for(let c=1;c<=4;c++)ws.getCell(r,c).fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFEEF1F5"}};
    ws.getCell(r,1).border={left:{style:"thick",color:{argb:"FF1F3A5F"}}};
    ws.getRow(r).height=onePage?17:22;r++;
    const line=(a,b,aOpt,bOpt)=>{
      put(r,1,a,{border:true,...aOpt});
      put(r,2,b,{border:true,...bOpt});merge(r,2,4);for(let c=3;c<=4;c++)ws.getCell(r,c).border=border;
      fitH(r,b,36);r++;
    };
    s.tt.forEach(x=>line(x.miss?MISS:x.t,x.v,x.miss?{...RED,align:{horizontal:"center"}}:{align:{horizontal:"center"}},{}));
    s.singles.forEach(x=>line(x.l,x.miss?MISS:x.v,{fill:"FFF7F7F7"},x.miss?RED:{}));
    s.lists.forEach(L=>{
      const n=L.cols.length;
      const span=i=>i<n-1?[i+1,i+1]:[n,4];
      L.cols.forEach((c,i)=>{const [a,b]=span(i);put(r,a,c,{border:true,fill:"FFF7F7F7",font:{bold:true}});merge(r,a,b);for(let k=a;k<=b;k++)ws.getCell(r,k).border=border});
      r++;
      L.rows.forEach(row=>{
        row.forEach((v,i)=>{const [a,b]=span(i);put(r,a,v,{border:true});merge(r,a,b);for(let k=a;k<=b;k++)ws.getCell(r,k).border=border});
        fitH(r,row.join(" "),40);r++;
      });
    });
  });
  ws.headerFooter={oddFooter:"&C&8&P / &N"};
  return await wb.xlsx.writeBuffer();
}

const downloadsNS={async save({filename,data}){
  const type=filename.endsWith(".pdf")?"application/pdf":filename.endsWith(".xlsx")?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":"application/octet-stream";
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
  return {status:"saved"};
}};
